<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#e5d88e"/>
      <stop offset="1" stop-color="#b89e45"/>
    </linearGradient>
    <mask id="cut-da-stroke">
      <rect width="100%" height="100%" fill="white" />
      <rect x="140" y="76" width="35" height="34" fill="black" />
    </mask>
    <style>
      @keyframes fadeIn {
        to { opacity: 1; transform: translate(0, 0); }
      }
      @keyframes dropFromLeft {
        from { transform: translate(-25px, -30px); opacity: 0; }
        to { transform: translate(0, 0); opacity: 1; }
      }
      @keyframes dropFromRight {
        from { transform: translate(25px, -30px); opacity: 0; }
        to { transform: translate(0, 0); opacity: 1; }
      }
      @keyframes dropFast {
        from { transform: translate(0, -40px); opacity: 0; }
        to { transform: translate(0, 0); opacity: 1; }
      }
      @keyframes drawLine {
        to { stroke-dashoffset: 0; }
      }
      @keyframes popIn {
        0% { transform: scale(0.5); opacity: 0; }
        70% { transform: scale(1.2); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }

      /* Baseline setup */
      .char { opacity: 0; font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'MS PMincho', serif; }
      
      /* First part: Fast fade in */
      .p1 { animation: fadeIn 0.4s ease forwards; }
      
      /* Middle part: Drop diagonally */
      .p2-l { animation: dropFromLeft 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
      .p2-r { animation: dropFromRight 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
      
      /* Tail part: Drop fast */
      .p3 { animation: dropFast 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

      /* Individual Delays */
      .d1 { animation-delay: 0.1s; }
      .d2 { animation-delay: 0.2s; }
      .d3 { animation-delay: 0.3s; }
      .d4 { animation-delay: 0.4s; }
      .d5 { animation-delay: 0.5s; }

      .d6 { animation-delay: 0.6s; }
      .d7 { animation-delay: 0.7s; }
      .d8 { animation-delay: 0.8s; }
      .d9 { animation-delay: 0.9s; }
      .d10 { animation-delay: 1.0s; }

      .d11 { animation-delay: 1.2s; }
      .d12 { animation-delay: 1.25s; }
      .d13 { animation-delay: 1.3s; }
      .d14 { animation-delay: 1.35s; }
      .d15 { animation-delay: 1.4s; }
      .d16 { animation-delay: 1.45s; }
      .d17 { animation-delay: 1.5s; }
      .d18 { animation-delay: 1.55s; }
      .d19 { animation-delay: 1.6s; }

      .gold-line {
        stroke-dasharray: 800;
        stroke-dashoffset: 800;
        animation: drawLine 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.8s;
      }
      
      .feather-end {
        opacity: 0;
        animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 2.0s;
      }
    </style>
  </defs>

  <!-- Gold Line -->
  <path class="gold-line" d="M 60,160 C 120,110 160,110 220,120 C 300,130 350,180 450,200 C 550,220 650,210 750,140" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" stroke-linecap="round"/>

