        </g>
      </g>
      <text x="100" y="100" mask="url(#cut-da-stroke)">大</text>
    </g>
    <g class="char p1 d2"><text x="175" y="100">切</text></g>
    <g class="char p1 d3"><text x="250" y="100">な</text></g>
    <g class="char p1 d4"><text x="325" y="100">人</text></g>
    <g class="char p1 d5"><text x="400" y="100">と</text></g>
  </g>

  <!-- Line 1 pt 2: いつかまた (Black, 45px) -->
  <g font-size="45" fill="#181818" font-weight="400">
    <g class="char p2-l d6"><text x="490" y="100">い</text></g>
    <g class="char p2-r d7"><text x="540" y="100">つ</text></g>
    <g class="char p2-l d8"><text x="590" y="100">か</text></g>
    <g class="char p2-r d9"><text x="640" y="100">ま</text></g>
    <g class="char p2-l d10"><text x="690" y="100">た</text></g>
  </g>

  <!-- Line 2: 巡り会えますように (Black, 45px) -->
  <g font-size="45" fill="#181818" font-weight="400">
    <g class="char p3 d11"><text x="195" y="170">巡</text></g>
    <g class="char p3 d12"><text x="245" y="170">り</text></g>
    <g class="char p3 d13"><text x="295" y="170">会</text></g>
    <g class="char p3 d14"><text x="345" y="170">え</text></g>
    <g class="char p3 d15"><text x="395" y="170">ま</text></g>
    <g class="char p3 d16"><text x="445" y="170">す</text></g>
    <g class="char p3 d17"><text x="495" y="170">よ</text></g>
    <g class="char p3 d18"><text x="545" y="170">う</text></g>
    <g class="char p3 d19"><text x="595" y="170">に</text></g>
  </g>

  <!-- End Feather -->
  <g class="feather-end" style="transform-origin: 780px 100px;">
    <!-- Floating above the end of the line, pointing down-left -->
    <g transform="translate(780, 100) rotate(-120) scale(-1.5, 1.5)">
      <g transform="translate(0, -24)">
